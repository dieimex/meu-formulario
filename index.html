<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro Completo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- onsubmit intercepta o envio e valida as senhas -->
        <form class="form-cadastro" action="#" method="POST" onsubmit="return validarSenhas()">
            
            <h2>Cadastro de Usuário</h2>
            <p>Preencha todas as informações abaixo para concluir o registro.</p>

            <!-- Dados Pessoais -->
            <h3>Dados Pessoais</h3>

            <div class="grupo-input">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="grupo-input">
                <label for="cpf">CPF</label>
                <!-- oninput aplica a máscara em tempo real -->
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" oninput="mascaraCPF(this)" required>
            </div>

            <div class="grupo-input">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(00) 00000-0000" oninput="mascaraTelefone(this)" required>
            </div>

            <div class="grupo-input">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <!-- Endereço -->
            <h3>Endereço</h3>

            <div class="grupo-input">
                <label for="cep">CEP</label>
                <!-- onblur dispara a consulta ViaCEP ao sair do campo -->
                <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" oninput="mascaraCEP(this)" onblur="buscarCEP(this.value)" required>
            </div>

            <div class="grupo-input">
                <label for="rua">Rua / Logradouro</label>
                <input type="text" id="rua" name="rua" placeholder="Rua, Avenida..." required>
            </div>

            <div class="grupo-input">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" placeholder="Ex: 123" required>
            </div>

            <div class="grupo-input">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
            </div>

            <div class="grupo-input">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
            </div>

            <div class="grupo-input">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                    <option value="" disabled selected>Selecione o estado...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Aapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <!-- Dados de Acesso -->
            <h3>Dados de Acesso (para sistemas digitais)</h3>

            <div class="grupo-input">
                <label for="username">Nome de Usuário (Login)</label>
                <input type="text" id="username" name="username" placeholder="Digite seu nome de usuário" required>
            </div>

            <div class="grupo-input">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="grupo-input">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente" required>
            </div>

            <!-- Termos e Autorizações -->
            <div class="grupo-input">
                <label>
                    <input type="checkbox" name="termos" required>
                    Li e concordo com os <a href="#" target="_blank">Termos de Uso</a> e a <a href="#" target="_blank">Política de Privacidade</a>
                </label>
            </div>

            <div class="grupo-input">
                <label>
                    <input type="checkbox" name="autorizacao">
                    Aceito receber novidades e comunicações por e-mail e/ou WhatsApp.
                </label>
            </div>

            <!-- Data do envio -->
            <div class="grupo-input">
                <label for="data-envio">Data do Envio</label>
                <input type="date" id="data-envio" name="data-envio" required>
            </div>

            <!-- Botão Enviar -->
            <button type="submit" class="btn-enviar">Cadastrar</button>
        </form>
    </div>

    <!-- Scripts de Máscaras e Validação -->
    <script>
        // Preenche a data do envio automaticamente com a data de hoje
        document.getElementById("data-envio").valueAsDate = new Date();

        // Máscara para CPF (000.000.000-00)
        function mascaraCPF(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = valor;
        }

        // Máscara para Telefone ((00) 00000-0000)
        function mascaraTelefone(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
            valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
            input.value = valor;
        }

        // Máscara para CEP (00000-000)
        function mascaraCEP(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
            input.value = valor;
        }

        // Busca de Endereço Automática pelo CEP
        function buscarCEP(valorCep) {
            const cepLimpo = valorCep.replace(/\D/g, "");
            if (cepLimpo.length === 8) {
                fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                    .then(res => res.json())
                    .then(dados => {
                        if (!dados.erro) {
                            document.getElementById("rua").value = dados.logradouro || "";
                            document.getElementById("bairro").value = dados.bairro || "";
                            document.getElementById("cidade").value = dados.localidade || "";
                            document.getElementById("estado").value = dados.uf || "";
                            document.getElementById("numero").focus();
                        } else {
                            alert("CEP não encontrado.");
                        }
                    })
                    .catch(err => console.error("Erro ao buscar CEP:", err));
            }
        }

        // Validação de Senhas
        function validarSenhas() {
            const senha = document.getElementById("senha").value;
            const confirmacaoSenha = document.getElementById("confirmar-senha").value;

            if (senha !== confirmacaoSenha) {
                alert("As senhas não coincidem! Por favor, digite novamente.");
                document.getElementById("confirmar-senha").focus();
                return false;
            }

            return true;
        }
    </script>
</body>
</html>
